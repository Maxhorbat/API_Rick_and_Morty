<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Rick and Morty</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container py-4">

    <h1 class="text-center mb-4 portal-glow">
        Rick and Morty Universe
    </h1>

    <div id="mensajeError"></div>

    <div class="row g-4" id="contenedorPersonajes"></div>

    <div class="pagination-container d-flex justify-content-center align-items-center gap-3">

        <button id="btnAnterior" class="btn btn-secondary">
            Anterior
        </button>

        <span id="textoPagina">
            Página 1
        </span>

        <button id="btnSiguiente" class="btn btn-primary">
            Siguiente
        </button>

    </div>

</div>

<!-- MODAL -->
<div class="modal fade" id="detalleModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo"></h5>
                <button
                    type="button"
                    class="btn-close btn-close-white"
                    data-bs-dismiss="modal">
                </button>
            </div>

            <div class="modal-body">
                <div id="modalContenido"></div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="app.js"></script>

</body>
</html>
